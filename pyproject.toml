[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-fastresolve"
description = "Faster URL resolving for Django, by indexing url patterns on their literal prefixes"
readme = "README.rst"
authors = [{ name = "Anders Hovmöller", email = "boxed@killingar.net" }]
license = { text = "BSD" }
requires-python = ">=3.10"
keywords = ["django", "urls", "performance"]
dependencies = ["Django >= 4.2"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/boxed/django-fastresolve"

[dependency-groups]
dev = ["pytest", "pytest-django", "django"]

[tool.hatch.version]
path = "django_fastresolve/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["django_fastresolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -r fEsxXw"
DJANGO_SETTINGS_MODULE = "tests.settings"
